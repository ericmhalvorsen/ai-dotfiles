# Codex Configuration
#
# This is TOML format - not JSON!
# Place this file at ~/.codex/config.toml (global) or .codex/config.toml (project)

[features]
multi_agent = true

[model]
default = "gpt-4o"

[permissions]
# Allow these commands without confirmation
allow = [
  "npm run *",
  "pnpm run *",
  "yarn run *",
  "git status",
  "git diff",
  "git log --oneline -10",
]

# Deny these commands
deny = [
  "rm -rf /",
  "sudo *",
]

[hooks]
# Run after file edits
post_edit = [
  "npm run lint",
  "npm run typecheck",
]

# Run before commits
pre_commit = [
  "npm run test:staged",
]

[env]
# Environment variables
CODEX_DEBUG = "false"
